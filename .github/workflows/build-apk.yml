name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Fonts from Google Fonts (OFL): IBM Plex Sans Arabic for text, Readex Pro for numbers.
      # The app falls back to the system font for any file that is missing.
      - name: Fetch fonts
        run: |
          d=app/src/main/assets/fonts
          mkdir -p $d
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          get() { curl -fsSL -o "$d/$1" "$2" || true; s=$(stat -c %s "$d/$1" 2>/dev/null || echo 0); [ "$s" -gt 30000 ] || rm -f "$d/$1"; }
          get plex-regular.ttf  "$base/ibmplexsansarabic/IBMPlexSansArabic-Regular.ttf"
          get plex-medium.ttf   "$base/ibmplexsansarabic/IBMPlexSansArabic-Medium.ttf"
          get plex-semibold.ttf "$base/ibmplexsansarabic/IBMPlexSansArabic-SemiBold.ttf"
          get plex-bold.ttf     "$base/ibmplexsansarabic/IBMPlexSansArabic-Bold.ttf"
          get readex.ttf        "$base/readexpro/ReadexPro%5BHEXP%2Cwght%5D.ttf"
          ls -la $d

      # Signing key from the repo secrets, if they are set (Settings → Secrets → Actions).
      - name: Signing key
        env:
          KS_B64: ${{ secrets.MIZANIA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "MIZANIA_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "using the key from secrets"
          else
            echo "no key in secrets: using app/mizania.keystore if present, else the debug key"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          # Compile errors as annotations, so they show on the run page.
          grep -E '^e: ' build.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done
          [ "$status" -eq 0 ] || exit "$status"
          cp app/build/outputs/apk/release/app-release.apk mizania.apk
        env:
          MIZANIA_KEY_PASSWORD: ${{ secrets.MIZANIA_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: mizania-apk
          path: mizania.apk

      # Latest APK as a release: open the repo's "Releases" on the phone and tap mizania.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest mizania.apk --title "ميزانيتي — آخر نسخة" --notes "بناء ${{ github.sha }}" --latest

      # Same APK on a side branch, so it can also be fetched with plain git
      - name: Push APK branch
        run: |
          mkdir out && cp mizania.apk out/ && cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add mizania.apk && git commit -q -m "APK ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
